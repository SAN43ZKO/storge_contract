<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ONLYOFFICE Editor</title>
    <script src="http://localhost:8082/web-apps/apps/api/documents/api.js"></script>
    <style>
        html, body { margin:0; padding:0; width:100%; height:100%; }
        #placeholder { width:100%; height:100%; }
    </style>
</head>
<body>
    <div id="placeholder"></div>
    <script>
        // При использовании JWT токен передаётся вторым аргументом в DocEditor
        var token = "{{.Token}}";
        
        // Пустой конфиг, так как все данные содержатся в JWT-токене
        var config = {};
        
        // Создаём редактор - токен передаётся отдельным параметром
        new DocsAPI.DocEditor('placeholder', config, token);
    </script>
</body>
</html>
