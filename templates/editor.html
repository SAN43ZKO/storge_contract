<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ONLYOFFICE Editor</title>
    <script src="http://localhost:8082/web-apps/apps/api/documents/api.js"></script>
    <style>
        html, body { margin:0; padding:0; width:100%; height:100%; }
        #placeholder { width:100%; height:100%; }
    </style>
</head>
<body>
    <div id="placeholder"></div>
    <script>
        // При включенном JWT в ONLYOFFICE, токен должен содержать весь конфиг
        // и передаваться как второй аргумент (замещая обычный конфиг)
        var token = "{{.Token}}";
        
        // Пустой конфиг - всё уже зашито в токен
        var cfg = {};
        
        // Создаём редактор - токен передаём как второй аргумент
        new DocsAPI.DocEditor('placeholder', token);
    </script>
</body>
</html>
