<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ONLYOFFICE Editor</title>
    <script src="http://localhost:8082/web-apps/apps/api/documents/api.js"></script>
    <style>
        html, body { margin:0; padding:0; width:100%; height:100%; }
        #placeholder { width:100%; height:100%; }
    </style>
</head>
<body>
    <div id="placeholder"></div>
    <script>
        // При включенном JWT в ONLYOFFICE, токен должен быть передан в параметре token
        var token = "{{.Token}}";
        
        // Конфигурация редактора - минимальная, так как основные данные в токене
        var cfg = {
            document: {},
            editorConfig: {},
            token: token
        };
        
        // Создаём редактор - передаём конфиг с токеном
        new DocsAPI.DocEditor('placeholder', cfg);
    </script>
</body>
</html>
