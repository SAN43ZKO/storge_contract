services:
#  # ваш file-service (пример)
  file-service:
    build: .
    ports:
      - "8021:8081"
    volumes:
      - ./files:/app/files
    environment:
      - FILES_DIR=/app/files
      - FILE_SERVICE_INTERNAL_URL=http://file-service:8021
      - ONLYOFFICE_JWT_SECRET=286Xrm1S9jLq7YSi0Qje
    networks:
      - app-network

  onlyoffice:
    image: onlyoffice/documentserver:latest
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=286Xrm1S9jLq7YSi0Qje
      - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
    networks:
      - app-network

networks:
  app-network:

volumes:
  onlyoffice_data:
  onlyoffice_log:

